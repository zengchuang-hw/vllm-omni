# Gemma 3 AR -> Mammoth DiT. Requires a trained combined checkpoint.
async_chunk: false
pipeline: mammoth_moda25_gemma
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.5
    enforce_eager: true
    enable_prefix_caching: false
  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    gpu_memory_utilization: 0.3
    enforce_eager: true
    enable_prefix_caching: false
    default_sampling_params:
      extra_args:
        text_guidance_scale: 9.0
        cfg_range: [0.0, 1.0]
        num_inference_steps: 50
